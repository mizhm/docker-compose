services:
  docker-nessus:
    container_name: docker-nessus
    image: sakurashiro/nessus:latest
    environment:
      - TZ=Asia/Ho_Chi_Minh
    cap_add:
      - LINUX_IMMUTABLE
    ports:
      - "8834:8834"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -skf https://localhost:8834/server/status | grep -q ''"code":200''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: no

volumes:
  nessus-data:
